<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c2541"/>
      <stop offset="60%" stop-color="#0b1021"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf0cd"/>
      <stop offset="35%" stop-color="#e5c07b"/>
      <stop offset="70%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#9a7b20"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGlow)"/>
  
  <!-- Outer Sacred Circles -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.4"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4,8" opacity="0.6"/>
  
  <!-- Triangle Sacred Geometry (3-6-9 Vortex) -->
  <polygon points="256,96 394,336 118,336" fill="none" stroke="url(#goldGrad)" stroke-width="3" filter="url(#goldGlow)"/>
  <polygon points="256,384 140,184 372,184" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.35"/>

  <!-- Center Star ✦ -->
  <text x="256" y="268" font-family="'Playfair Display', serif" font-size="46" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" filter="url(#goldGlow)">✦</text>

  <!-- Numbers 3, 6, 9 Nodes -->
  <!-- Top: 9 -->
  <circle cx="256" cy="96" r="34" fill="#0b1021" stroke="url(#goldGrad)" stroke-width="3" filter="url(#goldGlow)"/>
  <text x="256" y="108" font-family="'Playfair Display', serif, Georgia" font-size="30" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle">9</text>

  <!-- Bottom Left: 3 -->
  <circle cx="118" cy="336" r="34" fill="#0b1021" stroke="url(#goldGrad)" stroke-width="3" filter="url(#goldGlow)"/>
  <text x="118" y="348" font-family="'Playfair Display', serif, Georgia" font-size="30" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle">3</text>

  <!-- Bottom Right: 6 -->
  <circle cx="394" cy="336" r="34" fill="#0b1021" stroke="url(#goldGrad)" stroke-width="3" filter="url(#goldGlow)"/>
  <text x="394" y="348" font-family="'Playfair Display', serif, Georgia" font-size="30" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle">6</text>

  <!-- Subtle Subtext -->
  <text x="256" y="440" font-family="'Inter', sans-serif" font-size="19" font-weight="600" letter-spacing="6" fill="#e5c07b" text-anchor="middle" opacity="0.9">MANIFESTATION</text>
</svg>